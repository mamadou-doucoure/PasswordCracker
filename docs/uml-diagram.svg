<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="Consolas, 'Courier New', monospace" font-size="14">
  <defs>
    <marker id="hollowTriangle" markerWidth="16" markerHeight="14" refX="15" refY="7" orient="auto">
      <path d="M0,0 L15,7 L0,14 Z" fill="white" stroke="black" stroke-width="1"/>
    </marker>
    <marker id="openArrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="black" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="560" fill="white"/>

  <!-- HashCracker interface -->
  <g stroke="black" fill="white">
    <rect x="330" y="20" width="250" height="90" />
    <line x1="330" y1="68" x2="580" y2="68" />
  </g>
  <text x="455" y="38" text-anchor="middle" font-style="italic">&#171;interface&#187;</text>
  <text x="455" y="58" text-anchor="middle" font-weight="bold">HashCracker</text>
  <text x="345" y="88" font-size="13">+ crack(hash: String): String</text>

  <!-- HashCrackerFactory -->
  <g stroke="black" fill="white">
    <rect x="640" y="20" width="250" height="90" />
    <line x1="640" y1="58" x2="890" y2="58" />
  </g>
  <text x="765" y="45" text-anchor="middle" font-weight="bold">HashCrackerFactory</text>
  <text x="652" y="78" font-size="13">+ create(method: String):</text>
  <text x="672" y="96" font-size="13">HashCracker</text>

  <!-- DictionaryHashCracker -->
  <g stroke="black" fill="white">
    <rect x="30" y="260" width="290" height="150" />
    <line x1="30" y1="298" x2="320" y2="298" />
    <line x1="30" y1="342" x2="320" y2="342" />
  </g>
  <text x="175" y="285" text-anchor="middle" font-weight="bold">DictionaryHashCracker</text>
  <text x="42" y="317" font-size="13">- dictionaryPath: String</text>
  <text x="42" y="335" font-size="13">- attempts: long</text>
  <text x="42" y="360" font-size="13">+ crack(hash: String): String</text>
  <text x="42" y="378" font-size="13">+ getAttempts(): long</text>

  <!-- BruteForceHashCracker -->
  <g stroke="black" fill="white">
    <rect x="360" y="260" width="290" height="150" />
    <line x1="360" y1="298" x2="650" y2="298" />
    <line x1="360" y1="322" x2="650" y2="322" />
  </g>
  <text x="505" y="285" text-anchor="middle" font-weight="bold">BruteForceHashCracker</text>
  <text x="372" y="317" font-size="13">- attempts: long</text>
  <text x="372" y="340" font-size="13">+ crack(hash: String): String</text>
  <text x="372" y="358" font-size="13">+ getAttempts(): long</text>

  <!-- MD5Util -->
  <g stroke="black" fill="white">
    <rect x="690" y="280" width="200" height="90" />
    <line x1="690" y1="328" x2="890" y2="328" />
  </g>
  <text x="790" y="300" text-anchor="middle" font-style="italic" font-size="12">&#171;utility&#187;</text>
  <text x="790" y="318" text-anchor="middle" font-weight="bold">MD5Util</text>
  <text x="700" y="346" font-size="12">+ hash(input: String): String</text>

  <!-- Realization: DictionaryHashCracker ..|> HashCracker -->
  <line x1="180" y1="260" x2="410" y2="112" stroke="black" stroke-dasharray="6,4" marker-end="url(#hollowTriangle)"/>

  <!-- Realization: BruteForceHashCracker ..|> HashCracker -->
  <line x1="505" y1="260" x2="490" y2="112" stroke="black" stroke-dasharray="6,4" marker-end="url(#hollowTriangle)"/>

  <!-- Dependency: HashCrackerFactory ..> HashCracker (crée) -->
  <line x1="640" y1="65" x2="583" y2="65" stroke="black" stroke-dasharray="3,3" marker-end="url(#openArrow)"/>
  <text x="585" y="52" font-size="12" font-style="italic">&#171;crée&#187;</text>

  <!-- Dependency: DictionaryHashCracker ..> MD5Util (utilise) -->
  <path d="M320,340 C 500,420 600,400 688,335" fill="none" stroke="black" stroke-dasharray="3,3" marker-end="url(#openArrow)"/>
  <text x="470" y="410" font-size="12" font-style="italic">&#171;utilise&#187;</text>

  <!-- Dependency: BruteForceHashCracker ..> MD5Util (utilise) -->
  <line x1="650" y1="320" x2="688" y2="320" stroke="black" stroke-dasharray="3,3" marker-end="url(#openArrow)"/>
  <text x="655" y="308" font-size="11" font-style="italic">&#171;utilise&#187;</text>

  <text x="20" y="540" font-size="12" fill="#555">Diagramme de classes — PasswordCracker v1 (patron Simple Factory)</text>
</svg>
